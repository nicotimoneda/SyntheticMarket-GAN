[project]
name = "syntheticmarket"
version = "0.1.0"
description = "Synthetic financial time-series generation with a Wasserstein GAN (WGAN-GP)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Nicolás Timoneda" }]
dependencies = [
    "torch>=2.0",
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "yfinance>=0.2.40",
    "joblib>=1.3",
    "ipykernel>=6.29",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.urls]
Repository = "https://github.com/nicotimoneda/SyntheticMarket-GAN"
"Blog post" = "https://nicotimoneda.substack.com/p/wgan-gp-on-aapl-when-pca-looks-fine"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/syntheticmarket"]

[tool.ruff]
line-length = 88
target-version = "py311"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
